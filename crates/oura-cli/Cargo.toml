[package]
name = "oura-cli"
description = "Command-line client for reading data directly from an Oura ring"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "oura"
path = "src/main.rs"

[dependencies]
oura-protocol = { git = "https://github.com/Th0rgal/open_oura", rev = "4f7957d3304c4084f0e1e703f3d84606bf10b781" }
# Bluetooth transport (btleplug). Optional + behind the default `ble` feature so the
# k8s dashboard image can build with --no-default-features and no Bluetooth/dbus
# stack. See docs/kubernetes-deployment.md (Component 4).
oura-link = { git = "https://github.com/Th0rgal/open_oura", rev = "4f7957d3304c4084f0e1e703f3d84606bf10b781", optional = true }
oura-store = { git = "https://github.com/Th0rgal/open_oura", rev = "4f7957d3304c4084f0e1e703f3d84606bf10b781" }
oura-summary = { path = "../oura-summary" }
oura-dna = { path = "../oura-dna" }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
tokio = { version = "1", features = ["full"] }
# HTTP layer for `oura dashboard`. Replaces the hand-rolled single-read server so
# requests from a reverse proxy / ingress (headers and body split across reads,
# bodies larger than 8 KiB) parse correctly. See crates/oura-cli/src/dashboard.rs.
axum = "0.8"
tokio-stream = "0.1"
anyhow = "1"
hex = "0.4"
serde_json = "1"
regex = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
# Outbound HTTPS is used ONLY to fetch PUBLIC PGS Catalog score *definitions* from
# EBI on explicit user action (see dna.rs); no genome/personal data is ever sent.
# rustls (no system OpenSSL) keeps the macOS build turnkey.
ureq = { version = "2", default-features = false, features = ["tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
getrandom = "0.3"
tch = { version = "=0.22.0", optional = true } # pinned to libtorch 2.9.0 (repo venv)

[features]
default = ["ble"]
# Bluetooth LE support (the oura-link/btleplug transport). On by default. Build the
# dashboard server image with `--no-default-features` to drop btleplug and, on Linux,
# its dbus dependency: the dashboard and every saved-data/offline command still work,
# while the ring commands (scan, pair, sync, live-hr, feature-mode, rdata, viz, game,
# …) are compiled out and report a clear error at runtime.
ble = ["dep:oura-link"]
# Run the activity model in-process via LibTorch instead of shelling out to
# tools/run_activity_model.py. On Apple Silicon the only libtorch is the pip
# wheel, so the repo venv is aligned to torch 2.9.0 — the exact version tch 0.22
# targets — and we link against it (no version-check bypass needed). build.rs
# bakes the rpath, so no DYLD_LIBRARY_PATH at runtime:
#   export PATH="$PWD/.venv/bin:$PATH" LIBTORCH_USE_PYTORCH=1
#   cargo run --features torch -- sessions --tz-offset 1
torch = ["dep:tch"]
